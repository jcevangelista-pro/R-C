<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>R&C Printing Services</title>
    <link rel="stylesheet" href="LogInPage.css">
    <link rel="stylesheet" href="SignUpPage.css">
</head>
<body>

    <!--Navigation Bar-->
    <nav class="Navbar">
            <a href="LandingPage.html" id="BName">R&C PRINTING SERVICES</a>
        <ul>
            <li><a href=""><img src="../imgs/search.png" alt="" class="Img"></a></li>
            <li><a href=""><img src="../imgs/typing.png" alt="" class="Img"></a></li>
            <li><a href=""><img src="../imgs/trolley.png" alt="" class="Img"></a></li>
            <li><a href="">HOME</a></li>
            <li><a href="">PRODUCTS</a></li>
            <li><a href="">PORTFOLIO</a></li>
            <li><a href=""><img src="../imgs/user.png" alt="" class="Img"></a></li>
        </ul>
    </nav>

    <div class="RContainer">
        <div class="WSContainer">
            <div class="FormContainer">
                <div class="Circle">
                    <img src="../imgs/logo.jpg" alt="" class="logo">
                </div>

                <div class="FormContent">

                    <div class="Greetings">
                        <p>Welcome, User!</p>
                    </div>

                    <form action="" class="form" id="signupForm">
                        <label for="FirstName" class="Label">First Name</label>
                        <input type="text" id="FirstName" placeholder="Moiraine" required class="Input">

                        <label for="MiddleName" class="Label">Middle Name</label>
                        <input type="text" id="MiddleName" placeholder="Damodred" class="Input">
                        
                        <label for="LastName" class="Label">Last Name</label>
                        <input type="text" id="LastName" placeholder="Sanche" required class="Input">

                        <label for="email" class="Label">Email</label>
                        <input type="email" id="email" placeholder="Moiraine_Sanche40@gmail.com" required class="Input">

                        <label for="username" class="Label">Username</label>
                        <input type="text" id="username" placeholder="@JaydeeDamodred" minlength="8" required class="Input">

                        <label for="password" class="Label">Password</label>
                        <input type="password" id="password" placeholder="1234Damodred_!" minlength="8" maxlength="30" required class="Input" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}$"
                        title="Password must be at least 8 characters long and contain an uppercase letter, a lowercase letter, a number, and a special character.">

                        <div class="TermsPolicy">
                            <input type="checkbox" id="TermsandPolicy" required>
                            <label for="TermsandPolicy" class="Label">By creating this account, I agree to the <a href="">Terms and Privacy Policy.</a> </label>
                        </div> <br>

                        <div id="signupError" style="color:#ef4444;font-size:0.85rem;text-align:center;display:none;margin-bottom:10px;"></div>
                        <div id="signupSuccess" style="color:#22c55e;font-size:0.85rem;text-align:center;display:none;margin-bottom:10px;"></div>

                        <div class="Buttons">
                            <button type="button" id="BBack"><img src="back.png" alt="" id="BackImg">BACK</button>
                            <input type="submit" id="BSubmit" value="SIGN UP">
                        </div>

                        <div class="LogIn">
                            <p id="TLogIn">Have an account already?</p>
                            <a href="LogInPage.html" id="BLogIn"><strong>LOG IN</strong></a>  
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>
    
    <script>
    const signupForm = document.getElementById('signupForm');
    const signupError = document.getElementById('signupError');
    const signupSuccess = document.getElementById('signupSuccess');

    signupForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        signupError.style.display = 'none';
        signupSuccess.style.display = 'none';

        const data = {
            action: 'signup',
            first_name: document.getElementById('FirstName').value.trim(),
            middle_name: document.getElementById('MiddleName').value.trim(),
            last_name: document.getElementById('LastName').value.trim(),
            email: document.getElementById('email').value.trim(),
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
        };

        try {
            const res = await fetch('auth.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();

            if (result.success) {
                signupSuccess.textContent = result.message + ' Redirecting...';
                signupSuccess.style.display = 'block';
                setTimeout(() => {
                    window.location.href = '../LandingPage/LandingPage.html';
                }, 1500);
            } else {
                signupError.textContent = result.error;
                signupError.style.display = 'block';
            }
        } catch (err) {
            signupError.textContent = 'Something went wrong. Please try again.';
            signupError.style.display = 'block';
        }
    });

    // Back button
    document.getElementById('BBack').addEventListener('click', function() {
        window.history.back();
    });
    </script>
</body>
</html>
