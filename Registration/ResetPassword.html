<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - R&amp;C Printing Services</title>
    <link rel="stylesheet" href="LogInPage.css">
    <link rel="stylesheet" href="../CustomerNav.css">
</head>
<body>
    <nav class="Navbar"><a href="../LandingPage/LandingPage.html" id="BName">R&amp;C PRINTING SERVICES</a></nav>
    <div class="RContainer"><div class="WSContainer"><div class="FormContainer"><div class="FormContent">
        <div class="Greetings"><h1>Reset Password</h1><p>Create a new password for your account.</p></div>
        <form class="form" id="resetForm">
            <label for="newPassword" class="Label">New password</label>
            <div class="password-field"><input type="password" id="newPassword" required minlength="8" maxlength="30" autocomplete="new-password" class="Input"><button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false"><img src="../imgs/hidden.png" alt=""></button></div>
            <label for="confirmPassword" class="Label" style="margin-top:12px;">Confirm password</label>
            <div class="password-field"><input type="password" id="confirmPassword" required minlength="8" maxlength="30" autocomplete="new-password" class="Input"><button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false"><img src="../imgs/hidden.png" alt=""></button></div>
            <div id="resetMessage" role="status" aria-live="polite" style="display:none;font-size:.85rem;text-align:center;margin-top:14px;"></div>
            <div class="Buttons"><button type="button" id="BBack">BACK</button><input type="submit" id="BSubmit" value="RESET PASSWORD"></div>
        </form>
    </div></div></div></div>
    <script src="password_toggle.js"></script>
    <script>
    const token = new URLSearchParams(location.search).get('token') || '';
    const form = document.getElementById('resetForm');
    const message = document.getElementById('resetMessage');
    document.getElementById('BBack').addEventListener('click', () => location.href = 'LogInPage.html');
    if (!/^[a-f0-9]{64}$/.test(token)) {
        message.textContent = 'This reset link is invalid.'; message.style.color = '#dc2626'; message.style.display = 'block';
        document.getElementById('BSubmit').disabled = true;
    }
    form.addEventListener('submit', async event => {
        event.preventDefault();
        const password = document.getElementById('newPassword').value;
        if (password !== document.getElementById('confirmPassword').value) {
            message.textContent = 'Passwords do not match.'; message.style.color = '#dc2626'; message.style.display = 'block'; return;
        }
        const submit = document.getElementById('BSubmit'); submit.disabled = true;
        try {
            const response = await fetch('password_reset.php', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'reset', token, password})});
            const data = await response.json();
            message.textContent = data.message || data.error; message.style.color = data.success ? '#15803d' : '#dc2626'; message.style.display = 'block';
            if (data.success) { form.reset(); setTimeout(() => location.href = 'LogInPage.html', 1500); }
            else submit.disabled = false;
        } catch (_) {
            message.textContent = 'Unable to reset your password. Please try again.'; message.style.color = '#dc2626'; message.style.display = 'block'; submit.disabled = false;
        }
    });
    </script>
</body>
</html>
