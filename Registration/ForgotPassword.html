<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - R&amp;C Printing Services</title>
    <link rel="stylesheet" href="LogInPage.css">
    <link rel="stylesheet" href="../CustomerNav.css">
</head>
<body>
    <nav class="Navbar"><a href="../LandingPage/LandingPage.html" id="BName">R&amp;C PRINTING SERVICES</a></nav>
    <div class="RContainer"><div class="WSContainer"><div class="FormContainer"><div class="FormContent">
        <div class="Greetings"><h1>Forgot Password</h1><p>Enter the email address connected to your account.</p></div>
        <form class="form" id="forgotForm">
            <label for="email" class="Label">Email address</label>
            <input type="email" id="email" required autocomplete="email" class="Input" placeholder="name@example.com">
            <div id="resetMessage" role="status" aria-live="polite" style="display:none;font-size:.85rem;text-align:center;margin-top:14px;"></div>
            <div class="Buttons"><button type="button" id="BBack">BACK</button><input type="submit" id="BSubmit" value="SEND RESET LINK"></div>
        </form>
    </div></div></div></div>
    <script>
    const form = document.getElementById('forgotForm');
    const message = document.getElementById('resetMessage');
    document.getElementById('BBack').addEventListener('click', () => location.href = 'LogInPage.html');
    form.addEventListener('submit', async event => {
        event.preventDefault();
        const submit = document.getElementById('BSubmit');
        submit.disabled = true;
        message.style.display = 'none';
        try {
            const response = await fetch('password_reset.php', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'request', email:document.getElementById('email').value.trim()})});
            const data = await response.json();
            message.textContent = data.message || data.error;
            message.style.color = data.success ? '#15803d' : '#dc2626';
            message.style.display = 'block';
        } catch (_) {
            message.textContent = 'Unable to request a reset link. Please try again.';
            message.style.color = '#dc2626';
            message.style.display = 'block';
        } finally { submit.disabled = false; }
    });
    </script>
</body>
</html>
