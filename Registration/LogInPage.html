<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>R&C Printing Services</title>
    <link rel="stylesheet" href="LogInPage.css">
    <link rel="stylesheet" href="../CustomerNav.css">
</head>
<body>

    <!--Navigation Bar-->
    <nav class="Navbar">
            <a href="LandingPage.html" id="BName">R&C PRINTING SERVICES</a>
        <ul>
            <li><a href=""><img src="../imgs/Search.png" alt="" class="Img"></a></li>
            <li><a href=""><img src="../imgs/typing.png" alt="" class="Img"></a></li>
            <li><a href=""><img src="../imgs/trolley.png" alt="" class="Img"></a></li>
            <li><a href="">HOME</a></li>
            <li><a href="">PRODUCTS</a></li>
            <li><a href="">PORTFOLIO</a></li>
            <li><a href=""><img src="../imgs/user.png" alt="" class="Img"></a></li>
        </ul>
    </nav>

    <div class="RContainer">
        <div class="WSContainer">
            <div class="FormContainer">
                <div class="Circle">
                    <img src="../imgs/logo.jpg" alt="" class="logo">
                </div>

                <div class="FormContent">

                    <div class="Greetings">
                        <p>Welcome Back, User!</p>
                    </div>

                    <form action="" class="form" id="loginForm">
                        <label for="username" class="Label">Username</label> <br>
                        <input type="text" id="username" placeholder="@JaydeeDamodred" minlength="8" required class="Input"> <br>

                        <label for="password" class="Label">Password</label> <br>
                        <div class="password-field">
                            <input type="password" id="password" placeholder="1234Damodred_!" minlength="8" maxlength="30" required class="Input">
                            <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false"><img src="../imgs/hidden.png" alt=""></button>
                        </div> <br>

                        <div class="FPass">
                            <a href="ForgotPassword.html">Forgot Password</a>
                        </div> <br>

                        <div id="loginError" style="color:#ef4444;font-size:0.85rem;text-align:center;display:none;margin-bottom:10px;"></div>
                        <div id="loginSuccess" style="color:#22c55e;font-size:0.85rem;text-align:center;display:none;margin-bottom:10px;"></div>

                        <div class="Buttons">
                            <button type="button" id="BBack"><img src="back.png" alt="" id="BackImg">BACK</button>
                            <input type="submit" id="BSubmit" value="LOG IN">
                        </div>

                        <div class="SignUp">
                            <p id="TSignUp">Don't have an account yet?</p>
                            <a href="SignUpPage.html" id="BSignUp">SIGN UP</a>  
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>
    
    <script src="password_toggle.js"></script>
    <script>
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const loginSuccess = document.getElementById('loginSuccess');

    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        loginError.style.display = 'none';
        loginSuccess.style.display = 'none';

        const data = {
            action: 'login',
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
        };

        try {
            const res = await fetch('auth.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();

            if (result.success) {
                loginSuccess.textContent = result.message + ' Redirecting...';
                loginSuccess.style.display = 'block';
                setTimeout(() => {
                    window.location.href = result.redirect;
                }, 1000);
            } else {
                loginError.textContent = result.error;
                loginError.style.display = 'block';
            }
        } catch (err) {
            loginError.textContent = 'Something went wrong. Please try again.';
            loginError.style.display = 'block';
        }
    });

    // Back button
    document.getElementById('BBack').addEventListener('click', function() {
        window.history.back();
    });
    </script>
</body>
</html>
