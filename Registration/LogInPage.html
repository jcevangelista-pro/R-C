<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>R&C Printing Services</title>
    <link rel="icon" type="image/x-icon" href="../imgs/image 2.png">
    <link rel="stylesheet" href="LogInPage.css?v=6">
    <link rel="stylesheet" href="../CustomerNav.css">
</head>
<body>

    <!--Navigation Bar-->
    <nav class="Navbar">
        <a href="../LandingPage/LandingPage.html" id="BName">R&C PRINTING SERVICES</a>
        <button type="button" class="nav-hamburger" id="navHamburger" aria-label="Open menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <ul id="navMenu">
            
            <li class="nav-text-item"><a href="../LandingPage/LandingPage.html">HOME</a></li>
            <li class="nav-text-item"><a href="../Products/Prodbrowse.html">PRODUCTS</a></li>
            <li class="nav-text-item"><a href="../Portfolio/PortfolioPage.html">PORTFOLIO</a></li>
            <li class="nav-icon-item"><a href=""><img src="../imgs/user.png" alt="" class="Img"></a></li>
        </ul>
    </nav>

    <div class="RContainer">
        <div class="WSContainer">
            <div class="FormContainer">
                <div class="Circle">
                    <img src="../imgs/logo.jpg" alt="" class="logo">
                </div>

                <div class="FormContent">

                    <div class="Greetings">
                        <p>Welcome Back, User!</p>
                    </div>

                    <form action="" class="form" id="loginForm">
                        <label for="username" class="Label">Username</label> <br>
                        <input type="text" id="username" placeholder="@JaydeeDamodred" minlength="8" required class="Input"> <br>

                        <label for="password" class="Label">Password</label> <br>
                        <div class="password-field">
                            <input type="password" id="password" placeholder="1234Damodred_!" minlength="8" maxlength="30" required class="Input">
                            <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false"><img src="../imgs/hidden.png" alt=""></button>
                        </div> <br>

                        <div class="FPass">
                            <a href="ForgotPassword.html">Forgot Password</a>
                        </div> <br>

                        <div id="loginError" class="form-feedback form-feedback--error" role="alert" aria-live="assertive"></div>
                        <div id="loginSuccess" class="form-feedback form-feedback--success" role="status" aria-live="polite"></div>

                        <div class="Buttons">
                            <button type="button" id="BBack"><img src="back.png" alt="" id="BackImg">BACK</button>
                            <input type="submit" id="BSubmit" value="LOG IN">
                        </div>

                        <div class="SignUp">
                            <p id="TSignUp">Don't have an account yet?</p>
                            <a href="SignUpPage.html" id="BSignUp">SIGN UP</a>  
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>
    
    <script src="password_toggle.js"></script>
    <script>
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const loginSuccess = document.getElementById('loginSuccess');

    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        loginError.style.display = 'none';
        loginSuccess.style.display = 'none';

        const data = {
            action: 'login',
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
        };

        try {
            const res = await fetch('auth.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();

            if (result.success) {
                loginSuccess.textContent = result.message + ' Redirecting...';
                loginSuccess.style.display = 'block';
                setTimeout(() => {
                    window.location.href = result.redirect;
                }, 1000);
            } else {
                loginError.textContent = result.error;
                loginError.style.display = 'block';
            }
        } catch (err) {
            loginError.textContent = 'Something went wrong. Please try again.';
            loginError.style.display = 'block';
        }
    });

    // Back button
    document.getElementById('BBack').addEventListener('click', function() {
        window.history.back();
    });

    // Mobile hamburger menu toggle
    (function(){
        const burger = document.getElementById('navHamburger');
        const menu = document.getElementById('navMenu');
        if (burger && menu) {
            burger.addEventListener('click', function(e){
                e.stopPropagation();
                const open = menu.classList.toggle('open');
                burger.classList.toggle('open', open);
                burger.setAttribute('aria-expanded', open ? 'true' : 'false');
            });
            document.addEventListener('click', function(e){
                if (!menu.contains(e.target) && e.target !== burger) {
                    menu.classList.remove('open');
                    burger.classList.remove('open');
                    burger.setAttribute('aria-expanded', 'false');
                }
            });
        }
    })();
    </script>
</body>
</html>
