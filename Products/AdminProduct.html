<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Products - R&C Printing Services</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }

  body {
    background: #d9d9d9;
    display: flex;
    min-height: 100vh;
  }

  /* Sidebar */
    .sidebar {
    width: 220px;
    background: #1b1f4b;
    color: #fff;
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 20px 25px;
  }

  .brand .logo-circle {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #fff;
    color: #1b1f4b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 12px;
    flex-shrink: 0;
  }

  .brand-text {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.3;
    color: #FFFCFB;
  }

  .nav-label {
    font-size: 11px;
    letter-spacing: 1px;
    color: #9b9fc9;
    padding: 10px 20px 8px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    color: #d7d9f0;
    text-decoration: none;
    font-size: 14px;
    cursor: pointer;
  }

  .nav-item:hover {
    background: rgba(255,255,255,0.05);
  }

  .nav-item.active {
    background: #2a2f6b;
    color: #fff;
    border-left: 4px solid #ec4899;
    padding-left: 16px;
  }

  .nav-icon {
    font-size: 15px;
  }

  /* Main content */
   .main {
    flex: 1;
    padding: 30px 40px;
    margin-left: 220px;
  }
  .topbar {
    background: #fff;
    border-radius: 10px;
    padding: 18px 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }

  .topbar h1 {
    color: #ec4899;
    font-size: 26px;
    font-weight: 800;
  }

  .owner-tag {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #ec4899;
    font-weight: 700;
    font-size: 25px;
  }

  .owner-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #ec4899;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  .panel1, .panel2 {
    height: 15vh;
    background: #fff;
    border-radius: 10px;
    padding: 20px 25px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }

  .panel1 {
    margin-bottom: 20px;
    display: flex;
    gap: 20px;
  }

  .TContainer {
    margin: 0;
    padding-top: 15px;
    padding-left: 15px;
    display: flex;
    border-top: solid 3px #ec4899;
    border-radius: 10px;
    width: 25vw;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.203);
    
  }

  .TCategory {
    width: 200px;
    font-size: 1.5rem;
    padding-top: 5px;
    font-family: 'Franklin Gothic', 'Arial Narrow', Arial, sans-serif;
    color: #1b1f4b;
  }

  .TTopCategory {
    font-size: 2rem;
    font-family: 'Franklin Gothic', 'Arial Narrow', Arial, sans-serif;
    color: #ec4899;
    width: 200px;
    text-align: end; 
    padding-right: 10px;
    padding-left: 0;
  }

  .panel2 {
    height: 50rem;
  }

  .PCContainer {
    display: flex;
    gap: 40px;
  }

  .ProductCard {
    background-color: #c6caf6;
    border-radius: 20px;
    height: 50vh;
    width: 24vw;
    box-shadow: 0 4px 3px rgba(0, 0, 0, 0.215);
  }

  .ProductPicture {
    width: 22.5vw;
    height: 30vh;
    border-radius: 15px;
    margin-top: 10px;
    margin-left: 10px;
  }

  .TAddProduct {
    font-size: 1.8rem;
    font-family: 'Franklin Gothic', 'Arial Narrow', Arial, sans-serif;
    color: #1b1f4b;
    text-align: center;
    margin-top: 10px;
  }

  .ProductName, .ProductType {
    color: #1b1f4b;
    font-family: 'Franklin Gothic', 'Arial Narrow', Arial, sans-serif;
    margin-left: 15px;
  }

  .ProductName {
    font-size: 1.7rem;
    margin-top: 5px;
  }

  .ProductType {
    font-size: 1.2rem;
  }

  #addButton {
    font-family: 'Times New Roman', Times, serif;
    font-size: 5rem;
    font-weight: normal;
    margin-top: 50px;
    margin-left: 145px;
    border: none;
    background-color: white;
    cursor: pointer;
  }

  #WhiteBg {
    width: 22.5vw;
    height: 30vh;
    background-color: white;
    border-radius: 15px;
    margin-top: 10px;
    margin-left: 10px;
  }

  #ModalContainer, #ProductContent {
    background-color: #1e32636e;
    position: fixed;
    display: none;
    top: 0;
    left: 14vw;
    width: 85vw;
    height: 100vh;
    pointer-events: auto;
    align-content: center;
    z-index: 999;
  }

  #ModalContainer.show, #ProductContent.show {
    display: flex;
    pointer-events: auto;
  }

  #ContentModal { 
    background-color: #c6caf6;
    border-radius: 20px;
    height: 80vh;
    width: 75vw;
    box-shadow: 0 4px 3px rgba(0, 0, 0, 0.215);
    margin-left: 70px;
    margin-right: 0;
    margin-top: 10vh;
  }

  .TextAP, .TextUP {
    text-align: center;
    font-size: 2rem;
    font-weight: bold;
    color: #1b1f4b;
    margin-top: 20px;
  }

  #MAddProduct {
    background-color: white;
    font-family: 'Times New Roman', Times, serif;
    color: #1b1f4b;
    cursor: pointer;
    width: 30vw;
    height: 40vh;
    border: none;
    font-size: 5rem;
    border-radius: 10px;
    margin-left: 22vw;
    margin-top: 5px;
  }

  .ProductDetails {
   display: flex;
   flex-wrap: wrap;
   align-content: flex-start;
   column-gap: 0.8em;
   row-gap: 0.7em;
   width: 460px;
   height: 100px; 
   margin-left: 22vw;
   margin-top: 20px;
  }
  
  .PDInput {
    border: none;
    border-radius: 4px;
    width: 14.5vw;
    height: 5vh;
  }

  .PDInput::after {
    padding-left: 10px ;
  }

  .PDInput::placeholder {
    color: #1b1f4b;
    font-family: 'Franklin Gothic', 'Arial Narrow', Arial, sans-serif;
    font-weight: lighter;
    font-size: 1rem;
    padding-left: 10px;
  }

  .DropDown {
    color: #1b1f4b;
    font-family: 'Franklin Gothic', 'Arial Narrow', Arial, sans-serif;
    font-weight: lighter;
    border-radius: 4px;
    background-color: white;
    width: 14.5vw;
    height: 5vh;
    padding-top: 10px;
    padding-left: 10px;
  }

  .PDButtons {
    display: flex;
    gap: 50px;
    margin-left: 25.5vw;
    margin-top: 10px;
    
  }

  .UPDButtons {
    display: flex;
    gap: 25px;
    margin-left: 7.5vw;
    margin-top: 15px;
  }


  #PCCard { 
    background-color: #c6caf6;
    border-radius: 20px;
    height: 50vh;
    width: 65vw;
    box-shadow: 0 4px 3px rgba(0, 0, 0, 0.215);
    margin-left: 150px;
    margin-right: 0;
    margin-top: 10vh;
  }

  #ProductClose, #ProductAdding, #ProductCancel, #ProductUpdate {
    border: none;
    height: 6vh;
    width: 10vw;
    cursor: pointer;
    color: #1b1f4b;
    font-family: 'Franklin Gothic', 'Arial Narrow', Arial, sans-serif;
    font-weight: 200;
    font-size: 1.5rem;
    border-radius: 4px;
    background-color: white;
  }

  #ProductClose:hover, #ProductAdding:hover, #ProductCancel:hover, #ProductUpdate:hover  {
    color: white;
    background-color: #1b1f4b;
  }

  .ProductCard {
    cursor: pointer;
  }

  .PUContentCard {
    display: flex;
    margin-left: 50px;
  }

  .UProductDetails {
    display: flex;
    flex-wrap: wrap;
    max-width: 465px;
    column-gap: 0.8em;
    row-gap: 0.7em;
    margin-left: 50px;
    margin-top: 40px;
  }

  #FrontPageVisibility {
    margin-left: 50px;
    width: 20px;
    height: 20px;
    margin-top: 20px;
  }

  .Label {
    color: #1b1f4b;
    padding: 0;
    margin: 0;
    position: relative;
    top: -5px;
  }

</style>
</head>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="brand">
      <!-- <div class="logo-circle">R&amp;C</div> -->
       <img src="../imgs/image 2.png" alt="">

    <div class="panel1">

      </div>
      
      <div class="TContainer">
        <div class="TCategory">Total Sold: </div>
        <div class="TTopCategory" id="TTopCategory2"> 1,230</div>

      <div class="TContainer">
        <div class="TCategory">Top Category: </div>
        <div class="TTopCategory" id="TTopCategory3"> Sublimation</div>
      </div>
    </div>

    <div class="panel2">
      <div class="PCContainer">
        <div class="ProductCard" id="AddProduct">
          <div id="WhiteBg"><button id="addButton">+</button></div>
          <p class="TAddProduct">Add Product</p>

        <div id="ModalContainer">

              <div class="PDInput">
                <input type="text" class="PDInput" placeholder="Product Price" id="PDInput2" >
              </div>
            </div>

            <div class="PDButtons">
              <button id="ProductClose"><img src="" alt="">CANCEL</button>
              <button id="ProductAdding"><img src="" alt="">ADD</button>
            </div>
            
          </div>
        </div>

        
        <div class="ProductCard" id="ProductContent1">
            <img src="MugPicture.jpg" alt="" class="ProductPicture">
            <p class="ProductName">Tumbler (360ml)</p>
            <p class="ProductType">Mug & Tumbler</p>
        </div>

        <div id="ProductContent">
            <div id="PCCard">
              <div class="TextUP">
                Update Product
              </div>
              
              <div class="PUContentCard">
                <div class="ProductPictureUpdate">
                  <img src="MugPicture.jpg" alt="" class="ProductPicture">
                </div>

                <div>
                    <div class="UProductDetails">
                      <div>
                        <input type="text" class="PDInput" placeholder="Name of Product" id="PDInput1">
                      </div>

                      <div class="DropDown">Material Used</div>
                      <div class="DropDown" id="DropDown1">Type of Product </div>

                      <div class="PDInput">
                        <input type="text" class="PDInput" placeholder="Product Price" id="PDInput2" >
                      </div>
                    </div>

                    <input type="checkbox" id="FrontPageVisibility" required>
                    <label for="FrontPageVisibility" class="Label">Set Visible to Front Page </label>

                    <div class="UPDButtons">
                      <button id="ProductCancel"><img src="" alt="">CANCEL</button>
                      <button id="ProductUpdate"><img src="" alt="">UPDATE</button>
                    </div>

                </div>
              </div>
            </div>
        </div>

<script>
  const addButton = document.getElementById ('addButton');
  const ModalContainer = document.getElementById ('ModalContainer');
  const ProductClose = document.getElementById ('ProductClose');

  addButton.addEventListener('click', () => {
      ModalContainer.classList.add('show');
  });

  ProductClose.addEventListener('click', () => {
      ModalContainer.classList.remove('show');
  });
   
  /* Product Content Modal */
  const ProductContent1 = document.getElementById ('ProductContent1');
  const ProductContent = document.getElementById ('ProductContent');
  const ProductCancel = document.getElementById ('ProductCancel');

  ProductContent1.addEventListener('click', () => {
      ProductContent.classList.add('show');
  });

  ProductCancel.addEventListener('click', () => {
    ProductContent.classList.remove('show');
  });

</script>
