<style>

  /* ── SIDEBAR ──────────────────────────────────────────── */

  /* ── PRODUCTS PANEL ───────────────────────────────────── */

  /* Add Product card */

</style>

<script>
const PRODUCT_API = 'product_api.php';
let productsData = [];
let inventoryOptions = [];

// ── Load products from DB ───────────────────────────────────
async function loadProducts() {
  try {
    const res = await fetch(PRODUCT_API);
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    productsData = data.products;
    inventoryOptions = data.inventory_options || [];

    document.getElementById('TTopCategory1').textContent = data.stats.total;
    document.getElementById('TTopCategory2').textContent = '—';
    document.getElementById('TTopCategory3').textContent = data.stats.top_category;

    renderProducts(data.products);
  } catch (err) {
    console.error(err);
  }
}

function renderProducts(products) {
  const container = document.getElementById('productContainer');
  // Keep the Add Product card, remove the rest
  const addCard = document.getElementById('AddProduct');
  container.innerHTML = '';
  container.appendChild(addCard);

  products.forEach(p => {
    const card = document.createElement('div');
    card.className = 'ProductCard';
    card.dataset.id = p.id;

    if (p.image_path) {
      card.innerHTML = `
        <img src="${p.image_path}" alt="" class="ProductPicture">
        <p class="ProductName">${escHtml(p.name)}</p>
        <p class="ProductType">${escHtml(p.type_of_product || '')}</p>
      `;
    } else {
      card.innerHTML = `
        <div class="no-image-placeholder"></div>
        <p class="ProductName">${escHtml(p.name)}</p>
        <p class="ProductType">${escHtml(p.type_of_product || '')}</p>
      `;
    }

    card.addEventListener('click', () => openUpdateModal(p));
    container.appendChild(card);
  });
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── ADD PRODUCT ─────────────────────────────────────────────
const addButton = document.getElementById('addButton');
const ModalContainer = document.getElementById('ModalContainer');
const ProductClose = document.getElementById('ProductClose');
const ProductAdding = document.getElementById('ProductAdding');
const MAddProduct = document.getElementById('MAddProduct');
const addImageInput = document.getElementById('addImageInput');
const addImagePreview = document.getElementById('addImagePreview');

addButton.addEventListener('click', () => {
  document.getElementById('PDInput1').value = '';
  document.getElementById('PDInput2').value = '';
  document.getElementById('DropDownMaterial').selectedIndex = 0;
  document.getElementById('DropDownType').selectedIndex = 0;
  addImagePreview.style.display = 'none';
  MAddProduct.style.display = '';
  addImageInput.value = '';
  ModalContainer.classList.add('show');
});

ProductClose.addEventListener('click', () => { ModalContainer.classList.remove('show'); });

// Image upload button in Add modal
MAddProduct.addEventListener('click', () => { addImageInput.click(); });

addImageInput.addEventListener('change', function() {
  if (this.files && this.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      addImagePreview.src = e.target.result;
      addImagePreview.style.display = 'block';
      MAddProduct.style.display = 'none';
    };
    reader.readAsDataURL(this.files[0]);
  }
});

// Submit add
ProductAdding.addEventListener('click', async () => {
  const name = document.getElementById('PDInput1').value.trim();
  const price = document.getElementById('PDInput2').value.trim();
  const material = document.getElementById('DropDownMaterial').value;
  const type = document.getElementById('DropDownType').value;

  if (!name || !price) { alert('Name and price are required.'); return; }

  const formData = new FormData();
  formData.append('action', 'add');
  formData.append('name', name);
  formData.append('price', price);
  formData.append('material_used', material);
  formData.append('type_of_product', type);
  if (addImageInput.files[0]) {
    formData.append('image', addImageInput.files[0]);
  }

  try {
    const res = await fetch(PRODUCT_API, { method: 'POST', body: formData });
    const data = await res.json();
    if (data.success) {
      ModalContainer.classList.remove('show');
      await loadProducts();
      const created = productsData.find(p => Number(p.id) === Number(data.id));
      if (created) openUpdateModal(created);
      alert('Product created. Configure at least one inventory material before using it in production.');
    }
    else { alert(data.error); }
  } catch (err) { alert('Error adding product.'); }
});

// ── UPDATE PRODUCT ──────────────────────────────────────────
const ProductContent = document.getElementById('ProductContent');
const ProductCancel = document.getElementById('ProductCancel');
const ProductUpdate = document.getElementById('ProductUpdate');
const ProductArchive = document.getElementById('ProductArchive');
const updateImageInput = document.getElementById('updateImageInput');
const updateImagePreview = document.getElementById('updateImagePreview');
const changeImageBtn = document.getElementById('changeImageBtn');

function openUpdateModal(product) {
  document.getElementById('updateProductId').value = product.id;
  document.getElementById('UPDInput1').value = product.name;
  document.getElementById('UPDInput2').value = product.price;
  document.getElementById('UDropDownMaterial').value = product.material_used || '';
  document.getElementById('UDropDownType').value = product.type_of_product || '';
  document.getElementById('FrontPageVisibility').checked = product.front_page_visible == 1;
  updateImagePreview.src = product.image_path ? product.image_path : '';
  if (!product.image_path) updateImagePreview.style.display = 'none';
  else updateImagePreview.style.display = '';
  updateImageInput.value = '';
  renderBomRows(product.bom || []);
  ProductContent.classList.add('show');
}

function bomRowHtml(material = {}) {
  const options = inventoryOptions.map(item => `<option value="${item.inventory_id}" ${String(item.inventory_id) === String(material.inventory_id || '') ? 'selected' : ''}>${escHtml(item.item_name)} (${escHtml(item.unit_of_measure)})</option>`).join('');
  return `<div class="bom-row" style="display:grid;grid-template-columns:minmax(150px,1fr) 100px 36px;gap:6px;margin-bottom:6px;max-width:100%;">
    <select class="DropDown bom-material" style="width:100%;"><option value="">Select material</option>${options}</select>
    <input class="PDInput bom-quantity" type="number" min="0.01" step="0.01" value="${Number(material.quantity_required || 1)}" aria-label="Quantity required">
    <button type="button" class="remove-bom" aria-label="Remove material" style="border:0;border-radius:6px;cursor:pointer;">×</button>
  </div>`;
}

function renderBomRows(materials) {
  const host = document.getElementById('updateBomRows');
  host.innerHTML = (materials.length ? materials : [{}]).map(bomRowHtml).join('');
}

document.getElementById('addBomRow').addEventListener('click', () => {
  document.getElementById('updateBomRows').insertAdjacentHTML('beforeend', bomRowHtml());
});
document.getElementById('updateBomRows').addEventListener('click', e => {
  if (e.target.classList.contains('remove-bom')) e.target.closest('.bom-row').remove();
});

function collectBom() {
  return [...document.querySelectorAll('#updateBomRows .bom-row')].map(row => ({
    inventory_id: Number(row.querySelector('.bom-material').value),
    quantity_required: Number(row.querySelector('.bom-quantity').value)
  })).filter(item => item.inventory_id && item.quantity_required > 0);
}

ProductCancel.addEventListener('click', () => { ProductContent.classList.remove('show'); });

changeImageBtn.addEventListener('click', () => { updateImageInput.click(); });

updateImageInput.addEventListener('change', function() {
  if (this.files && this.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) { updateImagePreview.src = e.target.result; };
    reader.readAsDataURL(this.files[0]);
  }
});

// Submit update
ProductUpdate.addEventListener('click', async () => {
  const id = document.getElementById('updateProductId').value;
  const name = document.getElementById('UPDInput1').value.trim();
  const price = document.getElementById('UPDInput2').value.trim();
  const material = document.getElementById('UDropDownMaterial').value;
  const type = document.getElementById('UDropDownType').value;
  const frontPage = document.getElementById('FrontPageVisibility').checked;

  if (!name) { alert('Name is required.'); return; }

  const formData = new FormData();
  formData.append('action', 'update');
  formData.append('id', id);
  formData.append('name', name);
  formData.append('price', price);
  formData.append('material_used', material);
  formData.append('type_of_product', type);
  if (frontPage) formData.append('front_page_visible', '1');
  if (updateImageInput.files[0]) {
    formData.append('image', updateImageInput.files[0]);
  }

  try {
    const res = await fetch(PRODUCT_API, { method: 'POST', body: formData });
    const data = await res.json();
    if (data.success) {
      const bom = collectBom();
      if (!bom.length) { alert('Add at least one inventory material so stock can be deducted for this product.'); return; }
      const bomData = new FormData();
      bomData.append('action', 'save_bom'); bomData.append('id', id); bomData.append('materials', JSON.stringify(bom));
      const bomRes = await fetch(PRODUCT_API, {method:'POST', body:bomData});
      const bomResult = await bomRes.json();
      if (!bomResult.success) { alert(bomResult.error); return; }
      ProductContent.classList.remove('show'); loadProducts();
    }
    else { alert(data.error); }
  } catch (err) { alert('Error updating product.'); }
});

// Archive
ProductArchive.addEventListener('click', async () => {
  const id = document.getElementById('updateProductId').value;
  if (!confirm('Are you sure you want to archive this product?')) return;

  const formData = new FormData();
  formData.append('action', 'archive');
  formData.append('id', id);

  try {
    const res = await fetch(PRODUCT_API, { method: 'POST', body: formData });
    const data = await res.json();
    if (data.success) { ProductContent.classList.remove('show'); loadProducts(); }
    else { alert(data.error); }
  } catch (err) { alert('Error archiving product.'); }
});

// ── Init ────────────────────────────────────────────────────
loadProducts();
</script>
<script src="../Registration/admin_session.js"></script>
</body>
</html>
