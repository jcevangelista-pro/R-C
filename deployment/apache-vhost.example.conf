<VirtualHost *:80>
    ServerName example.com
    ServerAlias www.example.com
    DocumentRoot "/var/www/rnc-printing"

    <Directory "/var/www/rnc-printing">
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/rnc-error.log
    CustomLog ${APACHE_LOG_DIR}/rnc-access.log combined

    # Enable this only after the HTTPS virtual host/certificate exists.
    # Redirect permanent / https://example.com/
</VirtualHost>

