    <!-- =========================
         MAIN PROFILE
    ========================== -->

    <main class="ProfilePage">


        <div class="ProfileWrapper">


            <!-- =========================
                 PROFILE HEADER
            ========================== -->

            <section class="ProfileHeader">


                <!-- PROFILE PHOTO -->

                <div class="ProfilePictureWrapper">


                    <img
                        src="../imgs/user.png"
                        alt="Profile Picture"
                        class="ProfilePicture"
                        id="profilePicture"
                    >


                    <button
                        type="button"
                        class="ChangePhoto"
                        onclick="document.getElementById('photoInput').click()"
                    >
                        Change Photo
                    </button>


                    <input
                        type="file"
                        id="photoInput"
                        accept="image/*"
                        hidden
                    >


                </div>



                <!-- CUSTOMER DETAILS -->

                <div class="ProfileHeaderInfo">


                    <h1 id="displayName">
                        Juan Dela Cruz
                    </h1>


                    <p id="displayEmail">
                        juandelacruz@email.com
                    </p>


                    <span class="MemberBadge">
                        Customer
                    </span>


                </div>


            </section>



            <!-- =========================
                 BASIC INFORMATION
            ========================== -->

            <section class="ProfileSection">


                <div class="SectionHeader">


                    <h2>
                        Basic Information
                    </h2>


                    <p>
                        Manage your personal information.
                    </p>


                </div>



                <form id="profileForm">


                    <div class="FormGrid">


                        <!-- FIRST NAME -->

                        <div class="FormGroup">


                            <label for="firstName">
                                First Name
                            </label>


                            <input
                                type="text"
                                id="firstName"
                                name="firstName"
                                value="Juan"
                                disabled
                            >


                        </div>



                        <!-- LAST NAME -->

                        <div class="FormGroup">


                            <label for="lastName">
                                Last Name
                            </label>


                            <input
                                type="text"
                                id="lastName"
                                name="lastName"
                                value="Dela Cruz"
                                disabled
                            >


                        </div>



                        <!-- EMAIL -->

                        <div class="FormGroup FullWidth">


                            <label for="email">
                                Email Address
                            </label>


                            <input
                                type="email"
                                id="email"
                                name="email"
                                value="juandelacruz@email.com"
                                disabled
                            >


                        </div>



                        <!-- PHONE NUMBER -->

                        <div class="FormGroup FullWidth">


                            <label for="phone">
                                Phone Number
                            </label>


                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                value="09123456789"
                                disabled
                            >


                        </div>


                    </div>



                    <!-- PROFILE BUTTONS -->

                    <div class="FormActions">


                        <button
                            type="button"
                            class="EditButton"
                            id="editButton"
                        >
                            Edit Information
                        </button>


                        <button
                            type="submit"
                            class="SaveButton"
                            id="saveButton"
                            disabled
                        >
                            Save Changes
                        </button>


                    </div>


                </form>


            </section>



            <!-- =========================
                 CHANGE PASSWORD
            ========================== -->

            <section class="ProfileSection">


                <div class="SectionHeader">


                    <h2>
                        Change Password
                    </h2>


                    <p>
                        Update your password to keep your account secure.
                    </p>


                </div>



                <form id="passwordForm">


                    <!-- CURRENT PASSWORD -->

                    <div class="PasswordGroup">


                        <label for="currentPassword">
                            Current Password
                        </label>


                        <div class="PasswordInput">


                            <input
                                type="password"
                                id="currentPassword"
                                placeholder="Enter current password"
                            >


                            <button
                                type="button"
                                class="ShowPassword"
                                onclick="togglePassword(
                                    'currentPassword',
                                    this
                                )"
                            >
                                👁
                            </button>


                        </div>


                    </div>



                    <!-- NEW PASSWORD -->

                    <div class="PasswordGroup">


                        <label for="newPassword">
                            New Password
                        </label>


                        <div class="PasswordInput">


                            <input
                                type="password"
                                id="newPassword"
                                placeholder="Enter new password"
                            >


                            <button
                                type="button"
                                class="ShowPassword"
                                onclick="togglePassword(
                                    'newPassword',
                                    this
                                )"
                            >
                                👁
                            </button>


                        </div>


                    </div>



                    <!-- CONFIRM PASSWORD -->

                    <div class="PasswordGroup">


                        <label for="confirmPassword">
                            Confirm New Password
                        </label>


                        <div class="PasswordInput">


                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm new password"
                            >


                            <button
                                type="button"
                                class="ShowPassword"
                                onclick="togglePassword(
                                    'confirmPassword',
                                    this
                                )"
                            >
                                👁
                            </button>


                        </div>


                    </div>



                    <!-- CHANGE PASSWORD BUTTON -->

                    <div class="FormActions">


                        <button
                            type="submit"
                            class="SaveButton"
                        >
                            Change Password
                        </button>


                    </div>


                </form>


            </section>



            <!-- =========================
                 LOGOUT
            ========================== -->

            <div class="LogoutContainer">


                <button
                    type="button"
                    class="LogoutButton"
                    id="logoutButton"
                >
                    Logout
                </button>


            </div>


        </div>


    </main>
<script src="Profile.js"></script>
<script>
const navUser = document.getElementById('NavUser');
const userDropdown = document.getElementById('userDropdown');
if (navUser && userDropdown) {
    navUser.addEventListener('click', function(e) { e.preventDefault(); e.stopPropagation(); userDropdown.classList.toggle('show'); });
    document.addEventListener('click', function(e) { if (!userDropdown.contains(e.target) && e.target !== navUser) userDropdown.classList.remove('show'); });
    document.querySelectorAll('.logout-link').forEach(function(link) { link.addEventListener('click', function(e) { e.preventDefault(); if (confirm('Are you sure you want to log out?')) window.location.href = this.href; }); });
}
</script>
<style>
.user-menu-item { position: relative; }
.user-dropdown { display:none; position:absolute; top:100%; right:0; background:#fff; border-radius:10px; box-shadow:0 10px 24px rgba(107,33,168,0.2); min-width:150px; z-index:1000; overflow:hidden; }
.user-dropdown.show { display:flex; flex-direction:column; }
.user-dropdown a { padding:10px 16px; font-size:13px; color:#1E3163!important; text-decoration:none; font-weight:600!important; display:block; }
.user-dropdown a:hover { background:#ffe4f0; }
</style>
</body>
