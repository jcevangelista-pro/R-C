<script>
// User dropdown toggle
const navUser = document.getElementById('NavUser');
const userDropdown = document.getElementById('userDropdown');

navUser.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    userDropdown.classList.toggle('show');
});

document.addEventListener('click', function(e) {
    if (!userDropdown.contains(e.target) && e.target !== navUser) {
        userDropdown.classList.remove('show');
    }
});

// Logout confirmation
document.querySelectorAll('.logout-link').forEach(function(link) {
    link.addEventListener('click', function(e) {
        e.preventDefault();
        if (confirm('Are you sure you want to log out?')) {
            window.location.href = this.href;
        }
    });
});

// Load portfolio products from database grouped by type
async function loadPortfolioProducts() {
    try {
        const res = await fetch('../Products/product_api.php?view=portfolio');
        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        const container = document.getElementById('portfolioProducts');
        const grouped = data.products;

        if (Object.keys(grouped).length === 0) {
            container.innerHTML = '<p style="text-align:center;color:#9ca3af;padding:40px;">No products available yet.</p>';
            return;
        }

        let html = '';
        for (const [type, products] of Object.entries(grouped)) {
            html += `<h2>${type.toUpperCase()}</h2>`;
            html += '<div class="ProductsBox"><div class="ProductGrid">';
            products.forEach(p => {
                const imgHtml = p.image_path
                    ? `<img src="../Products/${p.image_path}" class="ProductImage" alt="${p.name}">`
                    : `<div class="ProductImage" style="background:#e5e7eb;width:100%;height:150px;border-radius:8px;"></div>`;
                html += `
                <div class="ProductCard">
                    ${imgHtml}
                    <h3>${p.name}</h3>
                </div>`;
            });
            html += '</div></div>';
        }

        container.innerHTML = html;
    } catch (err) {
        document.getElementById('portfolioProducts').innerHTML =
            `<p style="text-align:center;color:#ef4444;padding:40px;">Failed to load products: ${err.message}</p>`;
    }
}

loadPortfolioProducts();
</script>
