<!-- ── NOTIFICATIONS CONTENT ───────────────────────────── -->
<main class="page">
    <div class="notif-card">
        <div class="notif-header">
            <h1>Notifications</h1>
            <button class="mark-all-btn" id="markAllBtn">Mark all as read</button>
        </div>

        <div class="notif-list" id="notifList">
            <p class="notif-loading">Loading notifications...</p>
        </div>
    </div>
</main>

<script src="../CART/cart_badge.js"></script>
<script>
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// User dropdown
const navUser = document.getElementById('NavUser');
const userDropdown = document.getElementById('userDropdown');
if (navUser && userDropdown) {
    navUser.addEventListener('click', function(e) { e.preventDefault(); e.stopPropagation(); userDropdown.classList.toggle('show'); });
    document.addEventListener('click', function(e) { if (!userDropdown.contains(e.target) && e.target !== navUser) userDropdown.classList.remove('show'); });
    document.querySelectorAll('.logout-link').forEach(function(link) { link.addEventListener('click', function(e) { e.preventDefault(); if (confirm('Are you sure you want to log out?')) window.location.href = this.href; }); });
}

// Load notifications
async function loadNotifications() {
    try {
        const res = await fetch('notifications_api.php');
        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        const list = document.getElementById('notifList');

        if (data.notifications.length === 0) {
            list.innerHTML = '<p class="notif-empty">No notifications yet.</p>';
            return;
        }

        list.innerHTML = data.notifications.map(n => {
            const timeAgo = formatTime(n.created_at);
            const readClass = n.is_read ? 'read' : 'unread';
            const orderId = n.order_id || '';
            const targetUrl = n.target_url || '';
            return `
            <div class="notif-item ${readClass}" data-id="${n.notification_id}" data-order="${escapeHtml(orderId)}" data-target="${escapeHtml(targetUrl)}">
                <div class="notif-dot"></div>
                <div class="notif-content">
                    <div class="notif-title">${escapeHtml(n.title)}</div>
                    <div class="notif-message">${escapeHtml(n.message)}</div>
                    <div class="notif-meta">
                        <span class="notif-sender">From: ${escapeHtml(n.sender_name)} (${escapeHtml(n.sender_role)})</span>
                        <span class="notif-time">${timeAgo}</span>
                    </div>
                </div>
            </div>`;
        }).join('');

        // Click to mark as read and navigate to order
        list.querySelectorAll('.notif-item').forEach(item => {
            item.addEventListener('click', async function() {
                const id = this.dataset.id;
                const orderId = this.dataset.order;
                const targetUrl = this.dataset.target;

                // Mark as read
                if (this.classList.contains('unread')) {
                    await fetch('notifications_api.php', {
                        method: 'POST',
                        headers: {'Content-Type':'application/json'},
                        body: JSON.stringify({ action: 'mark_read', notification_id: parseInt(id) })
                    });
                    this.classList.remove('unread');
                    this.classList.add('read');
                }

                // Navigate to order process if order_id exists
                if (orderId && targetUrl) {
                    window.location.href = targetUrl;
                }
            });
        });

    } catch (err) {
        document.getElementById('notifList').innerHTML = `<p class="notif-empty" style="color:#ef4444;">Failed to load notifications.</p>`;
    }
}

// Mark all as read
document.getElementById('markAllBtn').addEventListener('click', async function() {
    await fetch('notifications_api.php', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ action: 'mark_all_read' })
    });
    document.querySelectorAll('.notif-item.unread').forEach(item => {
        item.classList.remove('unread');
        item.classList.add('read');
    });
});

function formatTime(dateStr) {
    const date = new Date(dateStr);
    const now = new Date();
    const diff = Math.floor((now - date) / 1000);

    if (diff < 60) return 'Just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

loadNotifications();
</script>
</body>
</html>
