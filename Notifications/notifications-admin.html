<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - R&amp;C Printing Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- Admin sidebar/topbar layout -->
  <link rel="stylesheet" href="../CUSTOMER/CustomerLand.css">
  <link rel="stylesheet" href="../UserSystem/UserSystem.css">
  <!-- Reused notification list styles -->
  <link rel="stylesheet" href="notifications.css">
  <style>
    /* Override the customer notifications.css body background so this page
       matches the admin dashboard layout. */
    body {
      background: #f6f7fb;
    }
    /* The shared admin ".main" uses display:flex with its direction commented
       out, which would place the topbar and content side by side. Force a
       column layout so the notifications box sits below the topbar and can use
       the full available width. */
    .main {
      flex-direction: column;
    }
    /* Notifications box fills the available width of the admin main area and
       flexes with the viewport, with a sensible cap on very wide screens. */
    .admin-notif-page {
      padding: 10px 0 40px;
      display: flex;
      justify-content: flex-start;
      width: 100%;
    }
    .admin-notif-page .notif-card {
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }
    /* The notification list grows with its content and scrolls only when it
       exceeds the viewport height. */
    .admin-notif-page .notif-list {
      max-height: calc(100vh - 220px);
    }

    /* ── Notification message modal ──────────────────────── */
    .notif-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(27, 31, 75, 0.55);
    }
    .notif-modal-overlay[hidden] { display: none; }
    .notif-modal {
      position: relative;
      width: min(560px, 100%);
      max-height: calc(100vh - 60px);
      overflow-y: auto;
      background: #fff;
      border-radius: 16px;
      padding: 28px 28px 22px;
      box-shadow: 0 20px 60px rgba(27, 31, 75, 0.3);
    }
    .notif-modal-close {
      position: absolute;
      top: 12px;
      right: 16px;
      border: 0;
      background: transparent;
      color: #9ca3af;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
    }
    .notif-modal-close:hover { color: #ec4899; }
    .notif-modal-title {
      margin: 0 28px 10px 0;
      font-size: 1.3rem;
      font-weight: 800;
      color: #1E3163;
      word-break: break-word;
    }
    .notif-modal-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #9ca3af;
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid #f3f4f6;
    }
    .notif-modal-message {
      font-size: 14px;
      line-height: 1.6;
      color: #374151;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .notif-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
    }
    .notif-modal-btn {
      min-width: 110px;
      padding: 10px 18px;
      border-radius: 9px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .notif-modal-btn.secondary {
      border-color: #e5e7eb;
      background: #fff;
      color: #374151;
    }
    .notif-modal-btn.secondary:hover { background: #f3f4f6; }
    .notif-modal-btn.primary {
      background: #ec4899;
      color: #fff;
    }
    .notif-modal-btn.primary:hover { background: #db2777; }
    .notif-modal-btn[hidden] { display: none; }
  </style>
</head>
<body>

  <!-- ── SIDEBAR ─────────────────────────────────────────── -->
  <div class="sidebar">
    <div class="brand">
      <img src="../imgs/image 2.png" alt="R&C Logo">
      <div class="brand-text">R&amp;C PRINTING<br>SERVICES</div>
    </div>

    <div class="nav-label">MAIN</div>
    <a class="nav-item" href="../Dashboard/Dashboard.html">
      <span>Dashboard</span>
      <span class="nav-icon"><img src="../imgs/Performance Macbook.png" alt=""></span>
    </a>
    <a class="nav-item" href="../Inventory/inventory-admin.html">
      <span>Inventory</span>
      <span class="nav-icon"><img src="../imgs/Boxes.png" alt=""></span>
    </a>
    <a class="nav-item" href="../Order/order-admin.html">
      <span>Orders</span>
      <span class="nav-icon"><img src="../imgs/Shopping Cart.png" alt=""></span>
    </a>
    <a class="nav-item" href="../CUSTOMER/CustomerLand.html">
      <span>Customer</span>
      <span class="nav-icon"><img src="../imgs/User Male.png" alt=""></span>
    </a>
    <a class="nav-item" href="../Products/AdminProduct.html">
      <span>Products</span>
      <span class="nav-icon"><img src="../imgs/Product.png" alt=""></span>
    </a>
    <a class="nav-item" href="../UserSystem/UserSystem.html">
      <span>Users</span>
      <span class="nav-icon"><img src="../imgs/user.png" alt=""></span>
    </a>
  </div>

  <!-- ── MAIN ───────────────────────────────────────────── -->
  <div class="main">

    <!-- Topbar -->
    <div class="topbar">
      <h1>Notifications</h1>
      <div class="owner-tag">
        <span>Admin</span>
        <img src="../imgs/Test Account.png" alt="Admin">
      </div>
    </div>

    <!-- Notifications content -->
    <div class="admin-notif-page">
      <div class="notif-card">
        <div class="notif-header">
          <h1>Notifications</h1>
          <button class="mark-all-btn" id="markAllBtn">Mark all as read</button>
        </div>
        <div class="notif-list" id="notifList">
          <p class="notif-loading">Loading notifications...</p>
        </div>
      </div>
    </div>

  </div>

  <!-- ── NOTIFICATION MESSAGE MODAL ──────────────────────── -->
  <div class="notif-modal-overlay" id="notifModalOverlay" hidden>
    <div class="notif-modal" role="dialog" aria-modal="true" aria-labelledby="notifModalTitle">
      <button type="button" class="notif-modal-close" id="notifModalClose" aria-label="Close">&times;</button>
      <h2 class="notif-modal-title" id="notifModalTitle">Notification</h2>
      <div class="notif-modal-meta">
        <span id="notifModalSender">From: —</span>
        <span id="notifModalTime"></span>
      </div>
      <div class="notif-modal-message" id="notifModalMessage"></div>
      <div class="notif-modal-actions">
        <button type="button" class="notif-modal-btn secondary" id="notifModalCloseBtn">Close</button>
        <a href="#" class="notif-modal-btn primary" id="notifModalViewOrder" hidden>View Order</a>
      </div>
    </div>
  </div>

  <!-- Admin session guard + topbar actions (role display, logout, bell) -->
  <script src="../Registration/admin_session.js"></script>
  <script>
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // Keep the loaded notifications so the modal can show full details by id.
  let notificationsById = {};

  // ── Modal controls ──────────────────────────────────────
  const notifModalOverlay = document.getElementById('notifModalOverlay');
  const notifModalViewOrder = document.getElementById('notifModalViewOrder');

  function openNotifModal(n) {
      document.getElementById('notifModalTitle').textContent = n.title || 'Notification';
      document.getElementById('notifModalSender').textContent =
          'From: ' + (n.sender_name || '—') + (n.sender_role ? ' (' + n.sender_role + ')' : '');
      document.getElementById('notifModalTime').textContent = formatTime(n.created_at);
      document.getElementById('notifModalMessage').textContent = n.message || '';

      if (n.order_id && n.target_url) {
          notifModalViewOrder.href = n.target_url;
          notifModalViewOrder.hidden = false;
      } else {
          notifModalViewOrder.removeAttribute('href');
          notifModalViewOrder.hidden = true;
      }

      notifModalOverlay.hidden = false;
  }

  function closeNotifModal() {
      notifModalOverlay.hidden = true;
  }

  document.getElementById('notifModalClose').addEventListener('click', closeNotifModal);
  document.getElementById('notifModalCloseBtn').addEventListener('click', closeNotifModal);
  notifModalOverlay.addEventListener('click', function(e) {
      if (e.target === notifModalOverlay) closeNotifModal();
  });
  document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && !notifModalOverlay.hidden) closeNotifModal();
  });

  async function loadNotifications() {
      try {
          const res = await fetch('notifications_api.php');
          const data = await res.json();
          if (!data.success) throw new Error(data.error);

          const list = document.getElementById('notifList');

          if (data.notifications.length === 0) {
              list.innerHTML = '<p class="notif-empty">No notifications yet.</p>';
              return;
          }

          notificationsById = {};
          data.notifications.forEach(n => { notificationsById[n.notification_id] = n; });

          list.innerHTML = data.notifications.map(n => {
              const timeAgo = formatTime(n.created_at);
              const readClass = n.is_read ? 'read' : 'unread';
              const orderId = n.order_id || '';
              const targetUrl = n.target_url || '';
              return `
              <div class="notif-item ${readClass}" data-id="${n.notification_id}" data-order="${escapeHtml(orderId)}" data-target="${escapeHtml(targetUrl)}">
                  <div class="notif-dot"></div>
                  <div class="notif-content">
                      <div class="notif-title">${escapeHtml(n.title)}</div>
                      <div class="notif-message">${escapeHtml(n.message)}</div>
                      <div class="notif-meta">
                          <span class="notif-sender">From: ${escapeHtml(n.sender_name)} (${escapeHtml(n.sender_role)})</span>
                          <span class="notif-time">${timeAgo}</span>
                      </div>
                  </div>
              </div>`;
          }).join('');

          list.querySelectorAll('.notif-item').forEach(item => {
              item.addEventListener('click', async function() {
                  const id = this.dataset.id;

                  if (this.classList.contains('unread')) {
                      await fetch('notifications_api.php', {
                          method: 'POST',
                          headers: {'Content-Type':'application/json'},
                          body: JSON.stringify({ action: 'mark_read', notification_id: parseInt(id) })
                      });
                      this.classList.remove('unread');
                      this.classList.add('read');
                  }

                  // Show the full notification message in the modal.
                  const notif = notificationsById[id];
                  if (notif) openNotifModal(notif);
              });
          });

      } catch (err) {
          document.getElementById('notifList').innerHTML = `<p class="notif-empty" style="color:#ef4444;">Failed to load notifications.</p>`;
      }
  }

  document.getElementById('markAllBtn').addEventListener('click', async function() {
      await fetch('notifications_api.php', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ action: 'mark_all_read' })
      });
      document.querySelectorAll('.notif-item.unread').forEach(item => {
          item.classList.remove('unread');
          item.classList.add('read');
      });
  });

  function formatTime(dateStr) {
      const date = new Date(dateStr);
      const now = new Date();
      const diff = Math.floor((now - date) / 1000);

      if (diff < 60) return 'Just now';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  loadNotifications();
  </script>
</body>
</html>
